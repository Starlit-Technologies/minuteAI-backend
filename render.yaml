services:
  - type: web
    name: minuteai-backend
    runtime: python
    plan: standard  # 2 GB RAM — required for headless Chromium (meeting bot)
    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.playwright playwright install chromium
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit

    # Persistent disk — now only needed for the Google Meet bot Chrome profile
    # and any short-lived temp files during processing.
    # Audio recordings and documents are stored permanently in Cloudflare R2.
    # Can be reduced to 1 GB once R2 is active.
    disk:
      name: minuteai-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 10

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # ── Meeting bot ──────────────────────────────────────────────────────────
      - key: MEETING_BOT_MODE
        value: playwright
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright

      # ── App ──────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: WHISPER_BACKEND
        value: groq
      - key: APP_URL
        value: https://minuteai-frontend.onrender.com
      - key: CORS_ORIGINS
        value: https://minuteai-frontend.onrender.com,https://minuteai-admin.onrender.com

      # ── Secrets (set in Render dashboard, not committed) ─────────────────────
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_TEAM_PRICE_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ZOOM_OAUTH_CLIENT_ID
        sync: false
      - key: ZOOM_OAUTH_CLIENT_SECRET
        sync: false
      - key: BACKEND_URL
        value: https://minuteai-backend.onrender.com

      # ── Cloudflare R2 (persistent audio & document storage) ──────────────────
      # Set these in the Render dashboard after creating your R2 bucket.
      # Get your API token from: Cloudflare Dashboard → R2 → Manage R2 API Tokens
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      # Optional — leave blank to use presigned URLs (recommended)
      - key: R2_PUBLIC_URL
        sync: false

      # ── Transcription backend ───────────────────────────────────────────────
      # groq = fast Whisper (default). assemblyai = diarization + speaker labels.
      - key: TRANSCRIPTION_BACKEND
        value: groq
      - key: ASSEMBLYAI_API_KEY
        sync: false
      # Optional: set to expected number of speakers (e.g. 2) for better accuracy
      - key: ASSEMBLYAI_SPEAKERS_EXPECTED
        sync: false

      # ── Translation backend ────────────────────────────────────────────
      # auto = DeepL (30 langs) → Claude fallback. deepl = DeepL only. claude = Claude only.
      - key: TRANSLATION_BACKEND
        value: auto
      - key: DEEPL_API_KEY
        sync: false

      # ── Deepgram (real-time live transcription) ────────────────────────
      # Required for /ws/live-translate WebSocket endpoint
      - key: DEEPGRAM_API_KEY
        sync: false
