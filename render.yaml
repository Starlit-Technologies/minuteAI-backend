services:
  - type: web
    name: minuteai-backend
    runtime: python
    plan: standard  # 2 GB RAM — required for headless Chromium (meeting bot)
    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit

    # Persistent disk — keeps uploads, outputs, and the Google Meet bot profile
    # across deploys and restarts.  All storage paths in the backend code resolve
    # to <project_root>/storage/, which is exactly where this disk is mounted.
    disk:
      name: minuteai-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 10

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # ── Meeting bot ──────────────────────────────────────────────────────────
      - key: MEETING_BOT_MODE
        value: playwright

      # ── App ──────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: WHISPER_BACKEND
        value: groq
      - key: APP_URL
        value: https://minuteai-frontend.onrender.com
      - key: CORS_ORIGINS
        value: https://minuteai-frontend.onrender.com,https://minuteai-admin.onrender.com

      # ── Secrets (set in Render dashboard, not committed) ─────────────────────
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_TEAM_PRICE_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ZOOM_OAUTH_CLIENT_ID
        sync: false
      - key: ZOOM_OAUTH_CLIENT_SECRET
        sync: false
      - key: BACKEND_URL
        value: https://minuteai-backend.onrender.com
